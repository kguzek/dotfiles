name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v7

      - name: Run ShellCheck
        uses: https://github.com/ludeeus/action-shellcheck@2.0.0
        with:
          ignore_paths: >-
            **/*.zsh
            ./.zprofile
            ./.zsh*
